<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ BARCELONA vs REAL MADRID</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100vw; height: 100vh;
    background: transparent;
    overflow: hidden;
    font-family: 'Oswald', sans-serif;
  }

  #game {
    position: absolute;
    top: 0; left: 0;
    width: 405px;
    height: 720px;
    overflow: hidden;
    transform-origin: top left;
  }

  /* ── CAMPO ── */
  .field {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(180deg,
      #2d8c2d 0, #2d8c2d 45px,
      #339933 45px, #339933 90px);
  }
  .field-svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ── BALÓN ── */
  #ball {
    position: absolute;
    width: 64px; height: 64px;
    left: 171px; top: 161px;
    z-index: 12;
    object-fit: contain;
    image-rendering: pixelated;
    animation: ballFloat 2.2s ease-in-out infinite;
    filter: drop-shadow(0 6px 14px #00000088);
    transition: left 0.7s ease, top 0.7s ease, transform 0.7s ease, opacity 0.5s;
  }
  @keyframes ballFloat {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-8px) rotate(20deg); }
  }

  /* ── PORTERÍA ── */
  .goal-layer {
    position: absolute; left: 140px; top: 108px;
    width: 125px; height: 46px;
    pointer-events: none;
  }
  #goalBack  { z-index: 11; }
  #goalFront { z-index: 13; transition: filter 0.3s; }
  .goal-layer svg { width: 100%; height: 100%; overflow: visible; transform-origin: 50% 0; }
  #goalFront.hit { filter: drop-shadow(0 0 12px #ffe600) drop-shadow(0 0 24px #ffe600aa); }
  #goalFront.hit svg { animation: netShake 0.8s ease-out; }
  @keyframes netShake {
    0%  { transform: scale(1); }
    15% { transform: scale(1.10,1.18); }
    35% { transform: scale(0.95,0.92); }
    55% { transform: scale(1.05,1.07); }
    75% { transform: scale(0.99,0.98); }
    100%{ transform: scale(1); }
  }

  /* ── JUGADORES ── */
  .player {
    position: absolute;
    width: 108px;
    display: flex; flex-direction: column;
    align-items: center; gap: 3px;
    z-index: 10;
    transition: bottom 0.5s cubic-bezier(0.22,1,0.36,1),
                left   0.5s cubic-bezier(0.22,1,0.36,1),
                right  0.5s cubic-bezier(0.22,1,0.36,1);
  }
  .player-img {
    height: 156px; width: auto;
    image-rendering: pixelated;
    filter: drop-shadow(0 4px 8px #00000077);
    animation: playerIdle 1.5s ease-in-out infinite;   /* palpita y se mueve aunque no pase nada */
  }
  #mbappe .player-img { animation-delay: -0.75s; }      /* desfasado para que no latan a la vez */
  .player.frozen .player-img { animation-play-state: paused; }
  @keyframes playerIdle {
    0%, 100% { transform: translateY(0)    scale(1, 1)       rotate(0deg); }
    25%      { transform: translateY(-4px) scale(1.02, 1.05) rotate(-1.5deg); }
    50%      { transform: translateY(0)    scale(1.05, 0.97) rotate(0deg); }
    75%      { transform: translateY(-4px) scale(1.02, 1.05) rotate(1.5deg); }
  }
  .player.boosting .player-img { animation: playerRun 0.22s ease-in-out 2; }
  @keyframes playerRun {
    0%  { transform: translateY(0); }
    30% { transform: translateY(-8px) scaleX(1.06); }
    60% { transform: translateY(0); }
    80% { transform: translateY(-4px) scaleX(0.96); }
    100%{ transform: translateY(0); }
  }

  .player-name {
    display: flex; align-items: center; gap: 4px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 12px; letter-spacing: 1.5px;
    text-shadow: 0 2px 6px #000;
    background: #000000bb;
    padding: 2px 8px 2px 4px; border-radius: 4px;
    white-space: nowrap;
  }
  .player-name img { width: 16px; height: 16px; object-fit: contain; }
  .player-name.lamine { color: #6db3ff; border: 1px solid #a5004488; }
  .player-name.mbappe { color: #ffd54a; border: 1px solid #ffffff55; }

  .wr { filter: grayscale(1) brightness(2.2); }

  .player-progress {
    font-size: 9px; color: #ffffffcc; background: #00000088;
    padding: 1px 6px; border-radius: 10px;
  }

  #lamine { left: 30px;  bottom: 100px; }
  #mbappe { right: 30px; bottom: 100px; }

  /* ── MARCADOR ── */
  .scoreboard {
    position: absolute;
    bottom: 8px; left: 50%;
    transform: translateX(-50%);
    background: #000000d9;
    border: 1px solid #ffffff33;
    border-radius: 14px;
    padding: 6px 12px;
    display: flex; align-items: center; gap: 10px;
    z-index: 30;
    backdrop-filter: blur(6px);
    white-space: nowrap;
  }
  .sc-team { display: flex; align-items: center; gap: 7px; position: relative; }
  .sc-team.right { flex-direction: row-reverse; }
  .sc-crest { width: 38px; height: 38px; object-fit: contain; filter: drop-shadow(0 2px 4px #000); }
  .sc-info { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .sc-name { font-family: 'Bebas Neue', sans-serif; font-size: 11px; letter-spacing: 1px; }
  .sc-name.l { color: #6db3ff; }
  .sc-name.m { color: #ffd54a; }
  .sc-gifts {
    font-family: 'Bebas Neue', sans-serif; font-size: 30px;
    color: #fff; line-height: 1; min-width: 34px; text-align: center;
  }
  .sc-gifts.pop { animation: scorePop 0.35s ease-out; }
  @keyframes scorePop {
    0%  { transform: scale(1); color: #fff; }
    40% { transform: scale(1.45); color: #ffe600; }
    100%{ transform: scale(1); color: #fff; }
  }
  .sc-bar  { width: 58px; height: 4px; background: #ffffff22; border-radius: 2px; overflow: hidden; }
  .sc-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; width: 0%; }
  .sc-fill.l { background: linear-gradient(90deg,#004d98,#a50044); }
  .sc-fill.m { background: linear-gradient(90deg,#febe10,#ffffff); }
  .sc-sep  { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: #ffffff88; letter-spacing: 1px; }

  /* ── HINCHADA EN EL CAMPO: un punto por persona que dona o comenta ── */
  .fans { position: absolute; inset: 0; z-index: 9; pointer-events: none; overflow: hidden; }
  .fan { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .fan-dot { width: 12px; height: 12px; border-radius: 50%; animation: fanBeat 0.9s ease-in-out infinite; }
  .fan.l .fan-dot { background: radial-gradient(circle at 35% 30%, #8cc2ff, #004d98 50%, #a50044); box-shadow: 0 0 8px #a50044dd; }
  .fan.m .fan-dot { background: radial-gradient(circle at 35% 30%, #ffffff, #febe10); box-shadow: 0 0 8px #febe10dd; }
  .fan-name { font-family: 'Bebas Neue', sans-serif; font-size: 10px; letter-spacing: 0.8px; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 1px 3px #000, 0 0 6px #000; animation: fanName 0.9s ease-in-out infinite alternate; }
  .fan.l .fan-name { color: #9cc9ff; }
  .fan.m .fan-name { color: #ffe27a; }
  .fan-conf { position: absolute; border-radius: 1px; }
  @keyframes fanBeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.4); } }
  @keyframes fanName { from { transform: translateY(0) scale(1); } to { transform: translateY(2px) scale(1.1); } }

  /* LIVE */
  .live-badge {
    position: absolute; top: 11px; right: 10px;
    background: #cc0000; color: #fff;
    font-size: 6px; padding: 3px 6px; border-radius: 3px;
    letter-spacing: 1px;
    animation: livePulse 1s ease-in-out infinite; z-index: 30;
  }
  @keyframes livePulse {
    0%,100% { box-shadow: 0 0 0 0 #ff000077; }
    50%      { box-shadow: 0 0 0 4px transparent; }
  }

  /* STATUS */
  .status-badge {
    position: absolute; top: 13px; left: 10px;
    font-size: 5px; z-index: 30;
    display: flex; align-items: center; gap: 4px;
  }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #888; transition: background 0.3s; }
  .status-dot.connected    { background: #00ff88; box-shadow: 0 0 5px #00ff88; }
  .status-dot.disconnected { background: #ff4444; }
  .status-text { color: #ffffff77; }

  .sound-hint {
    position: absolute; top: 28px; left: 10px; z-index: 31;
    background: #000000cc; color: #ffe600; font-size: 8px;
    padding: 3px 8px; border-radius: 10px; border: 1px solid #ffe60066;
    display: none; cursor: pointer;
  }
  .sound-hint.show { display: block; animation: livePulse 1s ease-in-out infinite; }

  /* ── PANEL DE REGALOS (a los costados) ── */
  .legend {
    position: absolute; top: 50px; z-index: 28;
    display: flex; flex-direction: column; gap: 4px; width: 86px;
  }
  .legend.left  { left: 4px; }
  .legend.right { right: 4px; }
  .legend-head { display: flex; align-items: center; gap: 5px; }
  .legend.right .legend-head { flex-direction: row-reverse; }
  .legend-head img { width: 20px; height: 20px; object-fit: contain; }
  .legend-head span {
    font-family: 'Bebas Neue', sans-serif; font-size: 12px; letter-spacing: 1px;
    color: #fff; text-shadow: 0 1px 3px #000;
  }
  .lg-item {
    display: flex; align-items: center; gap: 5px;
    background: #000000b8; border: 1px solid #ffffff2a;
    border-radius: 8px; padding: 3px 6px;
  }
  .legend.right .lg-item { flex-direction: row-reverse; text-align: right; }
  .lg-item.l { border-color: #6db3ff66; }
  .lg-item.m { border-color: #ffd54a66; }
  .lg-icon { font-size: 19px; line-height: 1; min-width: 22px; text-align: center; }
  .lg-icon.txt { font-family: 'Bebas Neue', sans-serif; font-size: 15px; color: #ffe600; letter-spacing: 1px; }
  .lg-act { display: flex; flex-direction: column; line-height: 1; gap: 1px; }
  .lg-pts { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 0.5px; }
  .lg-pts.up   { color: #5dff8c; }
  .lg-pts.down { color: #ff6b6b; }
  .lg-cap.two { white-space: normal; line-height: 1.1; }

  /* aviso del último minuto */
  .x2-banner {
    position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 31;
    display: none; white-space: nowrap;
    font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 1.5px; color: #fff;
    background: linear-gradient(90deg, #cc0000, #ff7a00); border: 1px solid #ffffffaa;
    border-radius: 12px; padding: 1px 12px; box-shadow: 0 0 14px #ff5500aa;
    animation: x2Pulse 0.6s ease-in-out infinite alternate;
  }
  .x2-banner.show { display: block; }

  /* ── REGALOS GRANDES ── */
  .legend .lg-item { padding: 2px 5px; }
  .legend .lg-icon { font-size: 16px; min-width: 20px; }
  .lg-pts { font-size: 14px; }
  .lg-item.big { border-color: #ffd700; background: linear-gradient(90deg, #3d2d00d9, #000000b8); box-shadow: 0 0 8px #ffd70088; }
  .lg-item.hot { border-color: #ffe600; box-shadow: 0 0 12px #ffe600; animation: hotPulse 0.6s ease-in-out infinite alternate; }
  @keyframes hotPulse { from { transform: scale(1); } to { transform: scale(1.06); } }

  .scene { position: absolute; inset: 0; z-index: 150; display: none; align-items: center; justify-content: center; pointer-events: none; }
  .scene.show { display: flex; background: #000000a0; }
  .scene.kick { display: block; background: radial-gradient(circle, transparent 38%, #000000b0 100%); }
  .sc-card { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; padding: 0 14px;
             animation: goalPop 0.45s cubic-bezier(0.175,0.885,0.32,1.275) forwards; }
  .sc-ico { font-size: 70px; line-height: 1; filter: drop-shadow(0 0 18px currentColor); }
  .sc-title { font-family: 'Bebas Neue', sans-serif; font-size: 46px; letter-spacing: 4px; line-height: 1; text-shadow: 0 3px 0 #000, 0 0 24px currentColor; }
  .sc-who { display: flex; align-items: center; gap: 8px; font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; color: #fff; text-shadow: 0 2px 0 #000; max-width: 380px; }
  .sc-who img { width: 38px; height: 38px; object-fit: contain; }
  .sc-sub { font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 1.5px; color: #fff; background: #000000aa; border-radius: 10px; padding: 1px 12px; }
  .scene.pen .sc-title, .scene.pen .sc-ico { color: #ffd700; }
  .scene.direct .sc-title, .scene.direct .sc-ico { color: #ff4d2e; }
  .scene.direct .sc-title { font-size: 50px; }
  .scene.freeze .sc-title, .scene.freeze .sc-ico { color: #7fe3ff; }

  .crown-tag { align-items: center; gap: 3px; max-width: 130px; margin-bottom: 2px; padding: 1px 8px; border-radius: 10px;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
               background: linear-gradient(90deg, #b44cff, #ff4ca8); color: #fff;
               font-family: 'Bebas Neue', sans-serif; font-size: 12px; letter-spacing: 1px;
               border: 1px solid #ffffff88; box-shadow: 0 0 10px #d04cffaa; }
  .crown-tag.pulse { animation: donorPulse 0.6s ease-out; }

  .player.frozen .player-img { filter: brightness(1.25) saturate(0.5) hue-rotate(170deg) drop-shadow(0 0 12px #8fe8ff) !important; }
  .ice { display: none; position: absolute; left: 4px; right: 4px; bottom: 34px; height: 164px; border-radius: 14px; pointer-events: none;
         justify-content: center; align-items: flex-start;
         background: linear-gradient(160deg, #c9f6ffaa, #6fd3ff55); border: 2px solid #e8fbffcc;
         box-shadow: 0 0 18px #7fe3ff, inset 0 0 18px #ffffffaa; }
  .player.frozen .ice { display: flex; }
  .ice-t { margin-top: 4px; font-family: 'Bebas Neue', sans-serif; font-size: 16px; color: #04323f; background: #ffffffd0; border-radius: 8px; padding: 0 6px; }

  .goal-by { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: #ffe600; letter-spacing: 2px; text-shadow: 0 2px 0 #000, 0 0 16px #ffe60099; text-align: center; max-width: 380px; }
  .final-mvp { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: #ffe600; letter-spacing: 2px; text-align: center; max-width: 380px;
               background: #000000aa; border: 1px solid #ffe60066; border-radius: 10px; padding: 2px 12px; text-shadow: 0 2px 0 #000; }
  @keyframes x2Pulse {
    from { transform: translateX(-50%) scale(1); }
    to   { transform: translateX(-50%) scale(1.07); }
  }

  /* marcador abajo del todo (zona libre) con el reloj integrado en el centro */
  .sc-center { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .sc-center .match-clock {
    position: static; transform: none; top: auto; left: auto;
    font-size: 17px; line-height: 20px; padding: 0 9px; border: none; background: #ffffff18;
  }
  .sc-center .match-clock.crit { animation: clockBeat 0.5s ease-in-out infinite alternate; }
  @keyframes clockBeat { from { transform: scale(1); } to { transform: scale(1.15); } }

  /* ── MAYOR DONADOR (encima de cada jugador) ── */
  .top-donor {
    display: none; align-items: center; gap: 3px; max-width: 130px; margin-bottom: 2px;
    padding: 1px 8px 1px 5px; border-radius: 10px; white-space: nowrap;
    background: linear-gradient(90deg, #ffcf40, #ff9d00); color: #1a1000;
    font-family: 'Bebas Neue', sans-serif; font-size: 12px; letter-spacing: 1px;
    border: 1px solid #ffffff88; box-shadow: 0 0 10px #ffcf4099;
  }
  .top-donor .td-name { overflow: hidden; text-overflow: ellipsis; max-width: 80px; }
  .top-donor .td-pts  { font-size: 9px; opacity: 0.75; }
  .top-donor.pulse { animation: donorPulse 0.6s ease-out; }
  @keyframes donorPulse { 0% { transform: scale(0.6); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
  .lg-cap { font-size: 6.5px; color: #ffffffb0; text-transform: uppercase; white-space: nowrap; }

  /* ── PATEADOR DEL PENAL (abajo, encima del escudo del equipo al que apoya) ── */
  .kicker {
    position: absolute; bottom: calc(100% + 6px); display: none;
    align-items: center; gap: 3px; max-width: 150px; padding: 1px 9px 1px 6px;
    border-radius: 10px; white-space: nowrap; overflow: hidden;
    font-family: 'Bebas Neue', sans-serif; font-size: 13px; letter-spacing: 1px;
    border: 1px solid #ffffffaa;
    animation: kickerBeat 0.7s ease-in-out infinite alternate;
  }
  .kicker.show { display: flex; }
  .kicker .k-name { overflow: hidden; text-overflow: ellipsis; }
  .sc-team .kicker { left: 0; transform-origin: left bottom; color: #fff; background: linear-gradient(90deg, #004d98, #a50044); box-shadow: 0 0 10px #a50044cc; }
  .sc-team.right .kicker { left: auto; right: 0; transform-origin: right bottom; color: #1a1000; background: linear-gradient(90deg, #febe10, #fff3b0); box-shadow: 0 0 10px #febe10cc; }
  @keyframes kickerBeat { from { transform: scale(1); } to { transform: scale(1.12); } }

  /* ── BARRIDAS / FALTAS ── */
  .tackler {
    position: absolute; height: 125px; width: auto; z-index: 35;
    image-rendering: pixelated; pointer-events: none; opacity: 0;
    filter: drop-shadow(0 4px 6px #000a);
  }
  .dust {
    position: absolute; border-radius: 50%; pointer-events: none; z-index: 34;
    background: radial-gradient(circle, #efe3c4cc 0%, #d9c89a66 55%, transparent 72%);
    animation: dustPuff 0.75s ease-out forwards;
  }
  @keyframes dustPuff {
    0%  { transform: scale(0.3); opacity: 0.9; }
    100%{ transform: scale(2.4) translateY(-14px); opacity: 0; }
  }
  .spark {
    position: absolute; width: 5px; height: 5px; border-radius: 50%;
    background: #ffcf40; pointer-events: none; z-index: 36;
  }
  .player-img.hit-soft { animation: hitSoft 0.85s ease-out; }
  .player-img.hit-hard { animation: hitHard 1.5s ease-out; }
  @keyframes hitSoft {
    0%  { transform: translateX(0) rotate(0);
          filter: drop-shadow(0 4px 8px #00000077) brightness(1); }
    20% { transform: translateX(calc(var(--d) * 14px)) rotate(calc(var(--d) * 14deg));
          filter: drop-shadow(0 0 10px #ffd400) brightness(1.5); }
    55% { transform: translateX(calc(var(--d) * 5px)) rotate(calc(var(--d) * 5deg)); }
    100%{ transform: translateX(0) rotate(0);
          filter: drop-shadow(0 4px 8px #00000077) brightness(1); }
  }
  @keyframes hitHard {
    0%  { transform: translate(0,0) rotate(0);
          filter: drop-shadow(0 4px 8px #00000077) brightness(1); }
    15% { transform: translate(calc(var(--d) * 8px), -30px) rotate(calc(var(--d) * 55deg));
          filter: drop-shadow(0 0 14px #ff2020) brightness(1.7); }
    40% { transform: translate(calc(var(--d) * -14px), 8px) rotate(calc(var(--d) * 88deg)); }
    70% { transform: translate(calc(var(--d) * -14px), 8px) rotate(calc(var(--d) * 88deg));
          filter: drop-shadow(0 0 8px #ff2020) brightness(1.2); }
    100%{ transform: translate(0,0) rotate(0);
          filter: drop-shadow(0 4px 8px #00000077) brightness(1); }
  }
  .foul-text {
    position: absolute; z-index: 60; text-align: center; pointer-events: none;
    font-family: 'Bebas Neue', sans-serif;
    animation: foulPop 1.9s ease-out forwards;
  }
  .ft-title { font-size: 20px; letter-spacing: 1.5px; line-height: 1; white-space: nowrap;
              text-shadow: 0 2px 0 #000, 0 0 12px currentColor; }
  .ft-pts   { font-size: 22px; color: #fff; text-shadow: 0 2px 0 #000; }
  .foul-text.soft { color: #ffe14d; }
  .foul-text.hard { color: #ff3b3b; }
  .foul-text.hard .ft-title { font-size: 22px; }
  @keyframes foulPop {
    0%  { transform: scale(0) rotate(-8deg); opacity: 0; }
    15% { transform: scale(1.25) rotate(3deg); opacity: 1; }
    30% { transform: scale(1) rotate(0); }
    80% { opacity: 1; }
    100%{ transform: translateY(-34px) scale(1); opacity: 0; }
  }
  .flash-red {
    position: absolute; inset: 0; z-index: 40; pointer-events: none; opacity: 0;
    background: radial-gradient(circle, transparent 35%, #ff0000aa 100%);
  }
  .flash-red.on { animation: flashRed 0.7s ease-out; }
  @keyframes flashRed { 0% { opacity: 1; } 100% { opacity: 0; } }
  #game.shake { animation: gameShake 0.5s linear; }
  @keyframes gameShake {
    0%,100%{ left: 0; top: 0; } 20% { left: -6px; top: 3px; } 40% { left: 6px; top: -3px; }
    60% { left: -4px; top: -2px; } 80% { left: 3px; top: 2px; }
  }
  .gift-popup.neg { color: #ff6b6b; text-shadow: 0 0 8px #ff3b3b; }
  .gg { color: #ffe600; font-family: 'Bebas Neue', sans-serif; font-weight: 400; }

  /* ── RELOJ DEL PARTIDO ── */
  .match-clock {
    position: absolute; top: 291px; left: 50%; transform: translateX(-50%);
    z-index: 30; display: flex; align-items: center; gap: 6px;
    font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px;
    color: #fff; line-height: 26px; padding: 0 12px;
    background: #000000d9; border: 1px solid #ffffff33; border-radius: 10px;
  }
  .match-clock.low { color: #ff6b6b; border-color: #ff3b3b88; }
  .match-clock.crit { animation: clockPulse 0.5s ease-in-out infinite alternate; }
  @keyframes clockPulse {
    from { transform: translateX(-50%) scale(1); }
    to   { transform: translateX(-50%) scale(1.18); }
  }

  /* ── FINAL DEL PARTIDO ── */
  .final-overlay { z-index: 210; gap: 6px; background: radial-gradient(circle, #2a2000f2 0%, #000000f7 80%); }
  .final-title {
    font-family: 'Bebas Neue', sans-serif; font-size: 34px; color: #fff; letter-spacing: 5px;
    text-shadow: 0 0 20px #ffffff88, 3px 3px 0 #000; text-align: center; line-height: 1;
  }
  .final-trophy { font-size: 60px; line-height: 1; animation: winnerBounce 0.6s ease-in-out infinite alternate; }
  .final-wrap { display: flex; align-items: flex-end; justify-content: center; gap: 10px; }
  .final-img {
    height: 210px; width: auto; image-rendering: pixelated;
    filter: drop-shadow(0 0 26px #ffe600cc);
    animation: winnerBounce 0.6s ease-in-out infinite alternate;
  }
  .final-img.small { height: 150px; }
  .final-name {
    font-family: 'Bebas Neue', sans-serif; font-size: 34px; color: #ffe600; letter-spacing: 3px;
    text-shadow: 0 0 24px #ffe600aa, 3px 3px 0 #000; text-align: center; line-height: 1.05;
    animation: goalPop 0.6s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
  }

  /* instrucciones */
  .instructions {
    position: absolute; bottom: 8px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 30;
  }
  .instr-chip {
    background: #000000cc; border-radius: 20px;
    padding: 3px 10px; font-size: 8px;
    display: flex; align-items: center; gap: 4px;
    white-space: nowrap; border: 1px solid #ffffff22;
  }
  .instr-chip.l { color: #6db3ff; border-color: #a5004488; }
  .instr-chip.m { color: #ffd54a; border-color: #ffffff55; }

  /* ── GOL OVERLAY ── */
  .goal-overlay {
    position: absolute; inset: 0;
    background: #000000cc;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px; z-index: 200;
  }
  .goal-overlay.show { display: flex; }
  .goal-big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 90px; color: #ffe600; line-height: 1;
    text-shadow: 0 0 40px #ffe600aa, 4px 4px 0 #000; letter-spacing: 6px;
    animation: goalPop 0.5s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
  }
  @keyframes goalPop {
    0%  { transform: scale(0) rotate(-12deg); opacity: 0; }
    70% { transform: scale(1.2) rotate(4deg); }
    100%{ transform: scale(1) rotate(0); opacity: 1; }
  }
  .goal-winner-wrap { display: flex; align-items: center; gap: 14px; }
  .goal-crest { width: 70px; height: 70px; object-fit: contain; filter: drop-shadow(0 0 14px #ffe60099); }
  .goal-winner-img {
    height: 200px; width: auto;
    image-rendering: pixelated;
    filter: drop-shadow(0 0 24px #ffe600bb);
    animation: winnerBounce 0.6s ease-in-out infinite alternate;
  }
  @keyframes winnerBounce {
    from { transform: translateY(0) scale(1); }
    to   { transform: translateY(-12px) scale(1.04); }
  }
  .goal-scorer-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px; color: #fff; letter-spacing: 3px;
    text-shadow: 0 0 20px #fff, 2px 2px 0 #000;
  }
  .goal-score {
    display: flex; align-items: center; gap: 10px;
    font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: #fff;
    letter-spacing: 2px; background: #000000aa; border: 1px solid #ffffff33;
    border-radius: 10px; padding: 4px 14px; margin-top: 2px;
  }
  .goal-score img { width: 30px; height: 30px; object-fit: contain; }
  .goal-score b { font-size: 34px; color: #ffe600; font-weight: 400; }
  .goal-cd { font-size: 10px; color: #ffffff88; margin-top: 4px; }
  .goal-cd span { color: #ffe600; font-size: 15px; }

  /* confetti */
  .confetti {
    position: absolute; border-radius: 2px;
    animation: confettiFall linear forwards;
    pointer-events: none;
  }
  @keyframes confettiFall {
    0%  { transform: translateY(-10px) rotate(0); opacity: 1; }
    100%{ transform: translateY(750px) rotate(720deg); opacity: 0; }
  }

  /* popup regalo */
  .gift-popup {
    position: absolute; pointer-events: none;
    z-index: 50; font-size: 9px;
    color: #ffe600; text-shadow: 0 0 8px #ffe600;
    animation: giftFloat 1.6s ease-out forwards;
    white-space: nowrap;
  }
  @keyframes giftFloat {
    0%  { opacity:1; transform: translateY(0) scale(1); }
    60% { opacity:1; transform: translateY(-30px) scale(1.2); }
    100%{ opacity:0; transform: translateY(-60px) scale(0.8); }
  }

  /* ══ MARCADORES ARRIBA (en el celular el chat tapa la parte de abajo) ══ */
  .wins-board {
    position: absolute; top: 5px; left: 50%; transform: translateX(-50%); z-index: 30;
    display: flex; align-items: center; gap: 8px; padding: 3px 12px; white-space: nowrap;
    background: #000000d9; border: 1px solid #ffd54a88; border-radius: 12px; backdrop-filter: blur(6px);
  }
  .wb-team { display: flex; align-items: center; gap: 6px; }
  .wb-crest { width: 24px; height: 24px; object-fit: contain; filter: drop-shadow(0 2px 4px #000); }
  .wb-num { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: #fff; line-height: 1; min-width: 20px; text-align: center; }
  .wb-num.pop { animation: scorePop 0.6s ease-out; }
  .wb-center { display: flex; flex-direction: column; align-items: center; line-height: 1; }
  .wb-label { font-family: 'Bebas Neue', sans-serif; font-size: 8px; letter-spacing: 1.5px; color: #ffd54a; }
  .wb-vs { font-family: 'Bebas Neue', sans-serif; font-size: 15px; color: #ffffff99; letter-spacing: 1px; }

  .scoreboard { top: 40px; bottom: auto; padding: 4px 8px; gap: 6px; border-radius: 12px; }
  .sc-team { gap: 4px; }
  .sc-crest { width: 28px; height: 28px; }
  .sc-name { display: none; }
  .sc-gifts { font-size: 26px; min-width: 26px; }
  .sc-bar { width: 34px; }
  .sc-center .match-clock { font-size: 14px; line-height: 18px; padding: 0 6px; }
  .sc-sep { font-size: 14px; }
  /* nombre del que pateó el penal: a los lados del marcador, del lado de su equipo */
  .sc-team .kicker { bottom: auto; top: 50%; margin-top: -9px; left: auto; right: calc(100% + 12px); max-width: 78px; font-size: 11px; transform-origin: right center; }
  .sc-team.right .kicker { right: auto; left: calc(100% + 12px); transform-origin: left center; }
  .legend { top: 88px; }
  .x2-banner { top: 84px; bottom: auto; }
  .sound-hint { top: 4px; left: 4px; z-index: 40; }
  .admin-toast {
    position: absolute; left: 50%; top: 372px; transform: translateX(-50%); z-index: 60; white-space: nowrap;
    background: #000000e6; border: 1px solid #ffe600; color: #ffe600; border-radius: 12px; padding: 3px 14px;
    font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 1px; animation: toastIn 0.25s ease-out;
  }
  .admin-toast.bad { border-color: #ff6b6b; color: #ff6b6b; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) scale(0.8); } to { opacity: 1; transform: translateX(-50%) scale(1); } }

  /* ══ TAP-TAP + RETENCIÓN ══ */
  .player-name { font-size: 12px; white-space: nowrap; }
  .legend-head span { font-size: 11px; letter-spacing: 0.5px; }
  .tap { position: absolute; bottom: 8px; z-index: 33; width: 108px; height: 26px; border-radius: 13px; overflow: hidden; background: #000000d0; border: 1px solid #ffffff44;
         display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 1px; color: #fff; }
  .tap.l { left: 8px; } .tap.m { right: 8px; }
  .tap i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; transition: width 0.25s; }
  .tap.l i { background: linear-gradient(90deg, #004d98aa, #a50044aa); } .tap.m i { background: linear-gradient(90deg, #febe10aa, #ffffff66); }
  .tap b { position: relative; font-weight: 400; }
  .tap.bump { animation: scorePop 0.3s; }
  #cta { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 33; max-width: 392px; white-space: nowrap; font-family: 'Bebas Neue', sans-serif;
         font-size: 15px; letter-spacing: 1.2px; color: #fff; background: #000000d9; border: 1px solid #ffe60099; border-radius: 12px; padding: 2px 12px; animation: ctaIn 0.4s ease-out; }
  #cta.hot { background: linear-gradient(90deg, #cc0000, #ff7a00); border-color: #fff; }
  @keyframes ctaIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%); } }
  #cd10 { position: absolute; left: 50%; top: 330px; transform: translate(-50%, -50%); z-index: 45; display: none; pointer-events: none;
          font-family: 'Bebas Neue', sans-serif; font-size: 150px; color: #fff; text-shadow: 0 0 30px #ff2d2d, 5px 5px 0 #000; }
  #cd10.show { display: block; animation: cdPulse 1s ease-out infinite; }
  @keyframes cdPulse { from { transform: translate(-50%, -50%) scale(1.5); opacity: 1; } to { transform: translate(-50%, -50%) scale(0.9); opacity: 0.35; } }
</style>
</head>

  { target:'mbappe', type:'foul', points:5,  emoji:'🍭', cap:'Falta táctica', grave:false, match:['paleta','piruleta','lollipop','lolly'] },
  { target:'mbappe', type:'foul', points:10, emoji:'🦴', cap:'Falta grave',   grave:true,  match:['hueso de perro','dog bone','hueso','bone'] },
  // ── REGALOS GRANDES (cambia nombres/emoji a tus regalos; el nombre debe coincidir con el de Tikfinity) ──
  // add 50 = suma 50 puntos · direct = PENAL: escena de penalti y GOL seguro · freeze = congela 15 s al jugador del panel (lo envía la hinchada rival)
  { target:'lamine', type:'add',     points:50,         big:true, emoji:'🦁', cap:'50 puntos',   match:['leon','lion'] },
  { target:'lamine', type:'direct',  points:GOAL_GIFTS, big:true, emoji:'🌌', cap:'Penal = GOL', show:'⚡',   match:['universo','tiktok universe','universe'] },
  { target:'lamine', type:'freeze',  points:0,          big:true, emoji:'🛥️', cap:'Congela 15s', show:'❄ 15s', match:['yate','yacht'] },
  { target:'mbappe', type:'add',     points:50,         big:true, emoji:'🏎️', cap:'50 puntos',   match:['coche deportivo','sports car'] },
  { target:'mbappe', type:'direct',  points:GOAL_GIFTS, big:true, emoji:'🚀', cap:'Penal = GOL', show:'⚡',   match:['cohete','rocket'] },
  { target:'mbappe', type:'freeze',  points:0,          big:true, emoji:'✈️', cap:'Congela 15s', show:'❄ 15s', match:['jet privado','avion privado','private jet'] }
];

// ── ÚLTIMO MINUTO: PUNTOS x2 (regalos, faltas y comentarios) ──
const DOUBLE_LAST_SECONDS = 60;   // cuántos segundos finales duplican los puntos
const pointsMult = () => (state.winner !== 'final' && state.endAt - Date.now() <= DOUBLE_LAST_SECONDS * 1000) ? 2 : 1;

// ── COMENTARIOS DEL CHAT (edita aquí puntos, palabras y límites) ──
const COMMENT_POINTS         = 0.5;    // puntos por comentario (un regalo mínimo vale +1, el doble)
const COMMENT_COOLDOWN       = 5000;   // ms: cada persona solo puede sumar 1 comentario cada 5 s
const COMMENT_MAX_PER_ROUND  = Infinity; // tope de puntos por comentarios por equipo y ronda (Infinity = sin tope; pon 50 para que la mitad del gol deba venir de regalos)
const COMMENT_WORDS = {
  lamine: ['barcelona', 'barca', 'visca barca', 'forca barca'],
  mbappe: ['halamadrid', 'hala madrid', 'real madrid']
};
const fmtPts = (v) => Number.isInteger(v) ? String(v) : v.toFixed(1);
const lastComment = {};
// Tolera letras repetidas (barcelonaaa, HALAMADRIDDD), espacios, emojis y signos: Hala Madrid!!!, #halamadrid, visca barca...
const squash = (s) => normName(s).replace(/[^a-z0-9]/g, '').replace(/(.)\1+/g, '$1');
const hasWord = (n, a) => squash(n).includes(squash(a));

function handleChat(data, sender) {
  const n = normName(data.comment || data.message || data.text || '');
  if (!n) return;
  const l = COMMENT_WORDS.lamine.some(a => hasWord(n, a));
  const m = COMMENT_WORDS.mbappe.some(a => hasWord(n, a));
  if (l === m) return;   // ninguna palabra, o menciona a los dos equipos: se ignora
  userTeam.set(normName(sender), l ? 'lamine' : 'mbappe'); commentPoint(l ? 'lamine' : 'mbappe', sender, String(data.uniqueId || sender));
}

function commentPoint(player, sender, key) {
  if (state.winner) return;
  addFan(player, sender, false);   // quien comenta aparece en el campo como hincha de ese equipo
  const now = Date.now();
  if (now - (lastComment[key] || 0) < COMMENT_COOLDOWN) return;
  if (state.cpts[player] >= COMMENT_MAX_PER_ROUND) return;
  if (isFrozen(player)) return;   // congelado: los comentarios no suman
  lastComment[key] = now;
  const pts = COMMENT_POINTS * pointsMult() * crowdMult(player);
  state.lastBy = sender;
  state.cpts[player] += pts;
  state[player] = Math.min(state[player] + pts, GOAL_GIFTS);
  renderPlayer(player);
  boost(player);
  showPopup(player, '💬', sender, '+' + pts);
  Sound.setTension();
  if (state[player] >= GOAL_GIFTS) triggerGoal(player);
}

// Balón: centro X=203. El jugador termina centrado bajo el balón
const PLAYER_W = 108;   // ancho de la caja del jugador (px)
const X_START = 30,  X_END = Math.round(GAME_W/2 - PLAYER_W - 2);   // cada jugador se queda a su lado del balón (así no se tapan al llegar)
const BOTTOM_START = 100, BOTTOM_END = 440 - FIELD_DY;

let MATCH_SECONDS = 600;  // duración del partido en segundos (10 min); en vivo: comando secreto T:minutos
const FINAL_PAUSE   = 12;   // segundos de celebración del ganador antes de empezar otro partido

const state = { lamine:0, mbappe:0, goals:{ lamine:0, mbappe:0 }, winner:null, cd:null, cf:null, endAt:0, pendingEnd:false, cpts:{ lamine:0, mbappe:0 }, donors:{ lamine:{}, mbappe:{} }, frozen:{ lamine:0, mbappe:0 }, bank:{ lamine:0, mbappe:0 }, crowd:{ lamine:0, mbappe:0 }, crown:{ lamine:'', mbappe:'' }, goalBy:'', goalDirect:false, lastBy:'', ck:'' };

function scaleGame() {
  document.getElementById('game').style.transform =
    `scale(${window.innerWidth/GAME_W}, ${window.innerHeight/GAME_H})`;
}

const pct = (p) => Math.min(state[p], GOAL_GIFTS) / GOAL_GIFTS;
const playerX      = (p) => Math.round(X_START + pct(p) * (X_END - X_START));
const playerBottom = (p) => Math.round(BOTTOM_START + pct(p) * (BOTTOM_END - BOTTOM_START));

// Coloca al jugador, su contador y su barra según sus puntos actuales
function renderPlayer(player) {
  const cfg = PLAYERS[player], el = document.getElementById(player), val = state[player];
  el.style.bottom = playerBottom(player) + 'px';          // movimiento diagonal
  el.style[cfg.side] = playerX(player) + 'px';
  document.getElementById(`${player}-count`).textContent = `${fmtPts(val)} / ${GOAL_GIFTS}`;
  document.getElementById(`bar-${player}`).style.width = (val/GOAL_GIFTS*100) + '%';
}

function boost(player) {
  const el = document.getElementById(player);
  el.classList.remove('boosting'); void el.offsetWidth; el.classList.add('boosting');
  setTimeout(() => el.classList.remove('boosting'), 520);
}

// SUBIR puntos (+1 / +10)
function advance(player, sender, points = 1, emoji = '⚽', raw = false) {
  if (!raw) points *= pointsMult();
  if (!raw && !state.winner) state.lastBy = sender;
  if (!raw && !state.winner && isFrozen(player)) {   // congelado: los puntos quedan guardados y llegan de golpe al descongelarse
    state.bank[player] += points;
    showPopup(player, '🧊', sender, '+' + fmtPts(points));
    return;
  }
  if (state.winner) return;
  state[player] = Math.min(state[player] + points, GOAL_GIFTS);
  renderPlayer(player);
  boost(player);
  showPopup(player, emoji, sender, '+' + points);
  Sound.gift();
  if (state[player] >= GOAL_GIFTS) triggerGoal(player);
}

function showPopup(player, emoji, sender, tag) {
  const popup = document.createElement('div');
  popup.className = 'gift-popup' + (tag && tag[0] === '-' ? ' neg' : '');
  popup.innerHTML = (emoji || '') + ' ';
  popup.appendChild(document.createTextNode((tag ? tag + ' ' : '') + (sender || 'Alguien')));
  const bottom = parseInt(document.getElementById(player).style.bottom) || BOTTOM_START;
  popup.style.bottom = Math.min(bottom + 175, 600) + 'px';
  popup.style[PLAYERS[player].side] = '90px';
  document.getElementById('game').appendChild(popup);
  setTimeout(() => popup.remove(), 1700);
}

// ── BAJAR puntos: el rival entra con una barrida ──
function dustAt(x, bottom, size) {
  const d = document.createElement('div');
  d.className = 'dust';
  d.style.width = d.style.height = size + 'px';
  d.style.left = (x - size/2) + 'px';
  d.style.bottom = bottom + 'px';
  document.getElementById('game').appendChild(d);
  setTimeout(() => d.remove(), 800);
}

function foulText(cx, bottom, hard, applied) {
  const d = document.createElement('div');
  d.className = 'foul-text ' + (hard ? 'hard' : 'soft');
  d.innerHTML = `<div class="ft-title">${hard ? '🟥 ¡FALTA GRAVE!' : '🟨 FALTA TÁCTICA'}</div>` +
                `<div class="ft-pts">${applied > 0 ? '-' + applied : '¡ya está en 0!'}</div>`;
  const w = 250;
  d.style.width = w + 'px';
  d.style.left = Math.min(Math.max(cx - w/2, 4), GAME_W - w - 4) + 'px';
  d.style.bottom = Math.min(bottom + 195, 600) + 'px';
  document.getElementById('game').appendChild(d);
  setTimeout(() => d.remove(), 2000);
}

function tackle(victim, hard, points, sender, emoji) {
  points *= pointsMult();
  if (state.winner) return;
  const rival = victim === 'lamine' ? 'mbappe' : 'lamine';
  const left  = PLAYERS[victim].side === 'left';
  const dir   = left ? 1 : -1;                           // el rival llega desde el lado del centro
  const x0    = playerX(victim), bottom = playerBottom(victim);
  const cx    = left ? x0 + PLAYER_W/2 : GAME_W - x0 - PLAYER_W/2;       // centro del jugador

  const dur = hard ? 650 : 950, contact = hard ? 0.5 : 0.55, rot = 82 * dir;
  const t = document.createElement('img');
  t.className = 'tackler'; t.src = PLAYERS[rival].img;
  t.style.left = (cx - 20) + 'px'; t.style.bottom = (bottom + 8) + 'px';
  document.getElementById('game').appendChild(t);
  const tf = (dx) => `translateX(${dir*dx}px) rotate(${rot}deg)`;
  t.animate([
    { transform: tf(210), opacity: 0, offset: 0,   easing: 'cubic-bezier(0.1,0.6,0.3,1)' },
    { transform: tf(185), opacity: 1, offset: 0.08, easing: 'ease-in' },
    { transform: tf(28),  opacity: 1, offset: contact, easing: 'ease-out' },
    { transform: tf(-6),  opacity: 1, offset: 0.82 },
    { transform: tf(-22), opacity: 0, offset: 1 }
  ], { duration: dur, fill: 'forwards' });
  setTimeout(() => t.remove(), dur + 80);

  // Polvareda a lo largo de la barrida
  const n = hard ? 7 : 5;
  for (let i = 0; i < n; i++) {
    const p = i / (n - 1);
    setTimeout(() => dustAt(cx + dir * (185 - 157*p), bottom + 26, 14 + Math.random()*(hard?20:12)),
               dur * (0.08 + (contact - 0.08) * p));
  }

  // Contacto: baja los puntos, el jugador cae, aparece el texto
  setTimeout(() => {
    if (state.winner) return;
    const applied = Math.min(points, state[victim]);
    state[victim] -= applied;
    renderPlayer(victim);

    const el = document.getElementById(victim), img = el.querySelector('.player-img');
    el.classList.remove('boosting');
    img.style.setProperty('--d', -dir);
    img.classList.remove('hit-soft', 'hit-hard'); void img.offsetWidth;
    img.classList.add(hard ? 'hit-hard' : 'hit-soft');
    setTimeout(() => img.classList.remove('hit-soft', 'hit-hard'), hard ? 1550 : 900);

    foulText(cx, bottom, hard, applied);
    showPopup(victim, emoji, sender, '-' + applied);
    dustAt(cx, bottom + 30, hard ? 46 : 32);
    if (hard) {
      for (let k = 0; k < 8; k++) {
        const s = document.createElement('div'); s.className = 'spark';
        s.style.left = cx + 'px'; s.style.bottom = (bottom + 50) + 'px';
        document.getElementById('game').appendChild(s);
        const a = Math.random()*Math.PI*2, r = 30 + Math.random()*40;
        s.animate([{ transform:'translate(0,0)', opacity:1 },
                   { transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px)`, opacity:0 }],
                  { duration: 500, easing: 'ease-out' });
        setTimeout(() => s.remove(), 520);
      }
      const g = document.getElementById('game');
      g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake');
      setTimeout(() => g.classList.remove('shake'), 520);
      const f = document.getElementById('flashRed');
      f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
    }
    Sound.foul(hard);
  }, dur * contact);
}

// ── Panel de regalos (se genera solo desde GIFTS) ──
function buildLegend() {
  buildLegendBase();
  addCommentRows();
}

function addCommentRows() {
  [['lamine','legendL','barcelona'], ['mbappe','legendR','halamadrid']].forEach(([p, id, word]) => {
    const d = document.createElement('div');
    d.className = 'lg-item ' + (p === 'lamine' ? 'l' : 'm');
    d.innerHTML = `<div class='lg-icon'>💬</div><div class='lg-act'><div class='lg-pts up'>+${fmtPts(COMMENT_POINTS * pointsMult() * crowdMult(p))}</div><div class='lg-cap two'>${crowdMult(p) > 1 ? '📣 HINCHADA x' + CROWD_MULT : 'comenta<br>' + word}</div></div>`;
    if (crowdMult(p) > 1) d.classList.add('hot');
    document.getElementById(id).appendChild(d);
  });
}

function buildLegendBase() {
  [['lamine','legendL'], ['mbappe','legendR']].forEach(([p, id]) => {
    const box = document.getElementById(id);
    box.innerHTML = `<div class="legend-head"><img src="${PLAYERS[p].crest}" alt=""><span>${PLAYERS[p].short}</span></div>`;
    GIFTS.filter(g => g.target === p).forEach(g => {
      const up = g.type !== 'foul' && g.type !== 'freeze';
      const d = document.createElement('div');
      d.className = 'lg-item ' + (p === 'lamine' ? 'l' : 'm');
      if (g.big) d.classList.add('big');
      d.innerHTML = `<div class="lg-icon${g.text ? ' txt' : ''}">${g.emoji}</div>` +
        `<div class="lg-act"><div class="lg-pts ${up ? 'up' : 'down'}">${g.show || ((up ? '+' : '-') + fmtPts(g.points * pointsMult()))}</div>` +
        `<div class="lg-cap">${g.cap}</div></div>`;
      box.appendChild(d);
    });
  });
}

function updateScoreboard(popPlayer) {
  ['lamine','mbappe'].forEach(p=>{
    const el = document.getElementById(`sc-${p}`);
    el.textContent = state.goals[p];
    if (p === popPlayer) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  });
}

function triggerGoal(player, by, direct) {
  if (state.golden) state.pendingEnd = true;   // gol de oro: tras la celebración termina el partido
  sceneQ.length = 0; hideScene();
  state.goalBy = (by !== undefined) ? by : state.lastBy; state.goalDirect = !!direct;
  state.winner = player;

  // 1) El balón vuela a la portería
  const ball = document.getElementById('ball');
  ball.style.animation  = 'none';
  ball.style.transition = 'all 0.6s cubic-bezier(0.25,0.46,0.45,0.94)';
  ball.style.left       = '171px';
  ball.style.top        = (FIELD_DY - 4) + 'px';
  ball.style.transform  = 'scale(0.5) rotate(540deg)';

  // 2) Entra: se mueve la red, suma el gol al que llegó primero
  setTimeout(() => {
    document.getElementById('goalFront').classList.add('hit');
    state.goals[player]++;
    updateScoreboard(player);
    spawnConfetti();
    Sound.goal();
  }, 550);

  // 3) Pantalla de ¡GOL!
  setTimeout(() => {
    const cfg = PLAYERS[player];
    document.getElementById('goalImg').src   = cfg.img;
    document.getElementById('goalCrest').src = cfg.crest;
    document.getElementById('goalScorer').textContent = cfg.goalText;
    document.getElementById('goalBy').textContent = state.goalBy ? (state.goalDirect ? '⚡ PENAL DE ⭐ ' : 'GOL DE ⭐ ') + state.goalBy : '';
    document.getElementById('goalScore').innerHTML =
      `<img src="${PLAYERS.lamine.crest}" alt=""> <b>${state.goals.lamine}</b> - <b>${state.goals.mbappe}</b> <img src="${PLAYERS.mbappe.crest}" alt="">`;
    document.getElementById('goalOverlay').classList.add('show');
    spawnConfetti();
    startCd(GOAL_PAUSE);
  }, 1300);
}

function spawnConfetti() {
  const colors = ['#ffe600','#004d98','#a50044','#fff','#febe10','#00ff88','#cc44ff'];
  const game = document.getElementById('game');
  for (let i=0;i<70;i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'confetti';
      if (state.winner === 'final') c.style.zIndex = 250;   // en la pantalla final el confeti va por encima
      c.style.left   = Math.random()*GAME_W+'px';
      c.style.top    = '-10px';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.width  = (5+Math.random()*9)+'px';
      c.style.height = (5+Math.random()*9)+'px';
      c.style.animationDuration = (1.5+Math.random()*2.5)+'s';
      game.appendChild(c);
      setTimeout(()=>c.remove(),4500);
    }, i*35);
  }
}

function startCd(sec) {
  clearInterval(state.cd);
  const el = document.getElementById('cdNum');
  el.textContent = sec;
  state.cd = setInterval(()=>{
    sec--;
    el.textContent = sec;
    if(sec<=0){ clearInterval(state.cd); resetGame(); }
  },1000);
}

function resetGame() {
  if (state.pendingEnd) { state.pendingEnd = false; endMatch(); return; }   // se acabó el tiempo durante un gol
  state.winner=null; state.lamine=0; state.mbappe=0; state.cpts={ lamine:0, mbappe:0 }; thawAll();
  document.getElementById('goalOverlay').classList.remove('show');
  Object.keys(PLAYERS).forEach(p=>{
    const el = document.getElementById(p);
    el.style.transition='none';
    el.style.bottom = BOTTOM_START+'px';
    el.style[PLAYERS[p].side] = X_START+'px';
    document.getElementById(`${p}-count`).textContent=`0 / ${GOAL_GIFTS}`;
    document.getElementById(`bar-${p}`).style.width='0%';
    setTimeout(()=>{ el.style.transition=''; },80);
  });
  const ball=document.getElementById('ball');
  ball.style.transition='none';
  ball.style.top=(55 + FIELD_DY) + 'px'; ball.style.left='171px';
  ball.style.transform=''; ball.style.opacity='1'; ball.style.animation='';
  document.getElementById('goalFront').classList.remove('hit');
  setTimeout(()=>{ball.style.transition='';},80);
  Sound.setTension(true);
}


// ── PARTIDO: reloj de 10 minutos + pantalla final ──
const fmtClock = (s) => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');

function tickClock() {
  if (state.winner === 'final') return;
  const left = Math.max(0, Math.ceil((state.endAt - Date.now()) / 1000));
  document.getElementById('clockTime').textContent = fmtClock(left);
  const box = document.getElementById('matchClock');
  box.classList.toggle('low',  left <= 60);
  box.classList.toggle('crit', left <= 10);
  tickEffects();
  const x2 = left <= DOUBLE_LAST_SECONDS;
  if (x2 !== state.x2) {   // entra o sale el modo puntos x2: aviso en pantalla y panel de regalos actualizado
    state.x2 = x2;
    document.getElementById('x2Banner').classList.toggle('show', x2 && state.winner !== 'final');
    buildLegend();
  }
  if (left <= 0) {
    if (state.winner) state.pendingEnd = true;   // hay un gol celebrándose: el final espera a que termine
    else endMatch();
  }
}

function endMatch() {
  if (!state.golden && state.goals.lamine === state.goals.mbappe) { startGolden(); return; }   // empate: gol de oro
  state.golden = false;
  state.winner = 'final'; state.pendingEnd = false;
  clearInterval(state.cd); clearInterval(state.cf);
  document.getElementById('x2Banner').classList.remove('show');   // el aviso de puntos x2 no se queda sobre la pantalla final
  document.getElementById('goalOverlay').classList.remove('show');
  const gl = state.goals.lamine, gm = state.goals.mbappe;
  if (gl !== gm) { const wp = gl > gm ? 'lamine' : 'mbappe'; wins[wp]++; updateWins(wp); }
  const score = `<img src="${PLAYERS.lamine.crest}" alt=""> <b>${gl}</b> - <b>${gm}</b> <img src="${PLAYERS.mbappe.crest}" alt="">`;
  let body;
  if (gl === gm) {
    body = `<div class="final-title">FINAL DEL PARTIDO</div>` +
      `<div class="final-wrap"><img class="final-img small" src="${PLAYERS.lamine.img}" alt=""><img class="final-img small" src="${PLAYERS.mbappe.img}" alt=""></div>` +
      `<div class="final-name">🤝 ¡EMPATE!</div>`;
  } else {
    const w = gl > gm ? 'lamine' : 'mbappe', cfg = PLAYERS[w];
    body = `<div class="final-title">FINAL DEL PARTIDO</div>` +
      `<div class="final-trophy">🏆</div>` +
      `<div class="final-wrap"><img class="goal-crest" src="${cfg.crest}" alt=""><img class="final-img" src="${cfg.img}" alt=""></div>` +
      `<div class="final-name">¡GANA ${cfg.team}!</div>`;
  }
  body += mvpHtml();
  body += `<div class="goal-score">${score}</div>` +
          `<div class="goal-cd">Nuevo partido en <span id="finalCd">${FINAL_PAUSE}</span>s</div>`;
  const ov = document.getElementById('finalOverlay');
  ov.innerHTML = body;
  ov.classList.add('show');

  Sound.final(); Sound.setTension();
  spawnConfetti();
  state.cf = setInterval(spawnConfetti, 2600);

  let sec = FINAL_PAUSE;
  state.cd = setInterval(() => {
    sec--;
    const e = document.getElementById('finalCd'); if (e) e.textContent = sec;
    if (sec <= 0) { clearInterval(state.cd); startMatch(); }
  }, 1000);
}

function startMatch() {
  state.golden = false; resetTaps();
  clearInterval(state.cd); clearInterval(state.cf);
  state.pendingEnd = false;
  state.goals.lamine = 0; state.goals.mbappe = 0; updateScoreboard();
  state.donors = { lamine:{}, mbappe:{} }; state.crown = { lamine:'', mbappe:'' }; state.crowd = { lamine:0, mbappe:0 }; sceneQ.length = 0; hideScene(); updateCrown('lamine'); updateCrown('mbappe'); updateTopDonor('lamine'); updateTopDonor('mbappe'); resetKickers(); clearFans();   // nuevo partido: se reinicia el ranking de donadores
  document.getElementById('finalOverlay').classList.remove('show');
  state.endAt = Date.now() + MATCH_SECONDS * 1000;
  resetGame();
  tickClock();
}

// ── SONIDO: muestras de público generadas (voces, palmas, bombo, silbatos, reverb de estadio) ──

const Sound = (() => {
  let ctx=null, master=null, analyser=null, muted=false, ready=false, lastOh=0;
  const buffers = {}, layers = {};

  const b64ToBuf = (b64) => { const bin=atob(b64), u=new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u.buffer; };
  const sstep = (a,b,x) => { x=Math.min(1,Math.max(0,(x-a)/(b-a))); return x*x*(3-2*x); };
  const tension = () => state.winner ? 1 : Math.max(pct('lamine'), pct('mbappe'));

  async function loadAll(){
    await Promise.all(Object.keys(SAMPLES).map(async k => {
      try { buffers[k] = await ctx.decodeAudioData(b64ToBuf(SAMPLES[k])); }
      catch(e){ console.warn('audio no cargó:', k, e); }
    }));
    // Tres capas de grada en bucle; se mezclan según lo cerca que está el gol
    ['low','mid','high'].forEach(k => {
      if (!buffers[k]) return;
      const s = ctx.createBufferSource(); s.buffer = buffers[k]; s.loop = true;
      const g = ctx.createGain(); g.gain.value = 0;
      s.connect(g); g.connect(master); s.start(0); layers[k] = g;
    });
    ready = true; setTension();
  }

  function init(){
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = muted ? 0 : SOUND_VOLUME;
    const comp = ctx.createDynamicsCompressor();          // evita saturación cuando se suman capas
    comp.threshold.value = -14; comp.ratio.value = 5; comp.attack.value = 0.01; comp.release.value = 0.25;
    analyser = ctx.createAnalyser(); analyser.fftSize = 1024;
    master.connect(comp); comp.connect(analyser); analyser.connect(ctx.destination);
    ctx.onstatechange = refreshHint; refreshHint();
    loadAll();
  }

  function refreshHint(){
    const h = document.getElementById('soundHint');
    if (h) h.classList.toggle('show', !!ctx && ctx.state !== 'running' && !muted);
  }
  function start(){
    init();
    if (ctx && ctx.state !== 'running') ctx.resume().then(refreshHint).catch(()=>{});
  }

  function setTension(slow){
    if (!ready) return;
    const tn = tension(), t = ctx.currentTime, tc = slow ? 1.2 : 0.5;
    let gl = 1.0 - 0.55*sstep(0.3,0.9,tn), gm = sstep(0.15,0.6,tn) * (1 - 0.4*sstep(0.75,1,tn)), gh = sstep(0.55,1.0,tn);
    if (state.winner) { gl = 0.15; gm = 0.35; gh = 0.6; }   // durante el gol manda la ovación
    if (layers.low)  layers.low.gain.setTargetAtTime(gl, t, tc);
    if (layers.mid)  layers.mid.gain.setTargetAtTime(gm, t, tc);
    if (layers.high) layers.high.gain.setTargetAtTime(gh, t, tc);
  }

  function play(name, gain=1, rate=1){
    if (!ready || !buffers[name] || ctx.state!=='running') return;
    const s = ctx.createBufferSource(), g = ctx.createGain();
    s.buffer = buffers[name]; s.playbackRate.value = rate; g.gain.value = gain;
    s.connect(g); g.connect(master); s.start();
  }

  // Cada regalo: "ooooh" de la grada, más grande cuanto más cerca del gol
  function gift(){
    setTension();
    const now = performance.now(), tn = tension();
    if (now - lastOh < 900) return;
    if (tn < 0.25 && Math.random() < 0.6) return;
    lastOh = now;
    const k = tn > 0.8 ? 'oh3' : tn > 0.5 ? 'oh2' : 'oh1';
    play(k, 0.55 + 0.45*tn, 0.96 + Math.random()*0.09);
  }

  // ¡GOL!: bocina + ovación + palmas + bombo
  function goal(){ play('goal', 0.75); setTension(); }

  // Falta: golpe + silbato de árbitro + ooooh de la grada
  function thud(hard){
    const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(hard ? 170 : 130, t);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.28);
    g.gain.setValueAtTime(hard ? 0.9 : 0.55, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.35);
  }
  function whistleBlast(dur, delay){
    const t = ctx.currentTime + delay;
    const o = ctx.createOscillator(), g = ctx.createGain(), tr = ctx.createOscillator(), tg = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 2850;
    tr.frequency.value = 38; tg.gain.value = 0.25;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.26, t + 0.03);
    g.gain.setValueAtTime(0.26, t + dur - 0.05);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    tr.connect(tg); tg.connect(g.gain); o.connect(g); g.connect(master);
    o.start(t); tr.start(t); o.stop(t + dur + 0.05); tr.stop(t + dur + 0.05);
  }
  function foul(hard){
    if (!ready || ctx.state !== 'running') return;
    thud(hard);
    whistleBlast(hard ? 0.85 : 0.4, 0.18);
    play(hard ? 'oh2' : 'oh1', hard ? 0.95 : 0.6, hard ? 0.82 : 0.9);
  }

  function toggleMute(){
    muted = !muted;
    if (master) master.gain.value = muted ? 0 : SOUND_VOLUME;
    refreshHint();
  }

  const level = () => { const d=new Uint8Array(analyser.fftSize); analyser.getByteTimeDomainData(d);
    let m=0; for (const v of d) m=Math.max(m,Math.abs(v-128)); return m/128; };

  return { start, setTension, gift, goal, foul, toggleMute, level,
           whistle(d){ if (ready && ctx.state === 'running') whistleBlast(d || 0.5, 0); },
           cheer(n, g, r){ play(n, g, r); },
           final(){ if (!ready || ctx.state !== 'running') return;
                    whistleBlast(0.35, 0); whistleBlast(0.35, 0.5); whistleBlast(1.0, 1.0); play('goal', 0.9); },
           get state(){ return ctx&&ctx.state; }, get loaded(){ return Object.keys(buffers); } };
})();

let ws=null, reconnT=null;
function connect(){
  setStatus('connecting');
  try{
    ws=new WebSocket('ws://localhost:21213');
    ws.onopen   =()=>{ setStatus('connected'); clearTimeout(reconnT); };
    ws.onclose  =()=>{ setStatus('disconnected'); reconnT=setTimeout(connect,3000); };
    ws.onerror  =()=>ws.close();
    ws.onmessage=(e)=>{ try{ const m=JSON.parse(e.data); debugEvent(m); handleEvent(m); }catch(err){ console.warn('evento no procesado:', err); } };
  }catch(e){ setStatus('disconnected'); reconnT=setTimeout(connect,3000); }
}

function debugEvent(m) {

    dbgLog.unshift(t + ': ' + String(d.comment || d.giftName || d.gift_name || '').slice(0, 24));

    document.getElementById('dbg').textContent = dbgLog.join('\n');
  } catch (_) {}
}

// ── COMANDOS SECRETOS (escríbelos en el chat del LIVE con tu usuario) ──
//   P:100  (o  P 100  /  P100)  → los puntos para llegar a la portería pasan a ser 100
//   T:10   (o  T 10   /  T10)   → el partido pasa a durar 10 minutos (el reloj de este partido también se reinicia a ese tiempo)
const ADMIN_USERS = ['futbolgalactico107', 'lionelestrada7'];   // usuarios (@) que pueden usar los comandos; si escribes desde otra cuenta, añádela aquí. [] = cualquiera
new URLSearchParams(location.search).get('admin')?.split(',').forEach(u => u.trim() && ADMIN_USERS.push(u.trim()));   // también: ...index.html?admin=cuenta1,cuenta2
const isAdminUser = (d) => { if (!ADMIN_USERS.length) return true; const uid = idNorm(d.uniqueId), ad = ADMIN_USERS.map(idNorm); return uid ? ad.includes(uid) : ad.includes(idNorm(d.nickname || d.displayName || d.senderDisplayName)); };
const idNorm = (s) => normName(String(s || '')).replace(/^@/, '').replace(/\s+/g, '');
function adminToast(text, bad) {   // aviso corto en pantalla (3,5 s) para confirmar que el comando llegó
  const el = document.createElement('div');
  el.className = 'admin-toast' + (bad ? ' bad' : '');
  el.textContent = text;
  document.getElementById('game').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
function adminCommand(data) {
  const txt = String(data.comment || data.message || data.text || '').replace(/[\u200B-\u200D\uFEFF]/g, '').trim();
  const m = txt.match(/^([pt])\s*[:=\uFF1A]?\s*(\d+(?:[.,]\d+)?)$/i);
  if (!m) {   // A:cuenta → una cuenta admin autoriza a otra (tu cuenta aparte) durante el live
    const a = txt.match(/^a\s*[:=]\s*@?([\w.]+)$/i);
    if (a && isAdminUser(data)) { ADMIN_USERS.push(a[1]); adminToast('⚙ ADMIN AÑADIDO: @' + a[1]); return true; }
    return false;
  }
  let ok = true;
  const uid = idNorm(data.uniqueId);
  if (ADMIN_USERS.length) {
    const admins = ADMIN_USERS.map(idNorm);
    ok = uid ? admins.includes(uid) : admins.includes(idNorm(data.nickname || data.displayName || data.senderDisplayName));   // sin @usuario en el evento, se usa el nombre
  }
  if (!ok) {   // no eres tú: se trata como comentario normal (y si lo escribió con ":" se avisa quién fue, para poder revisar)
    if (/[:=\uFF1A]/.test(txt)) adminToast('⚙ COMANDO IGNORADO · @' + (uid || idNorm(data.nickname) || '?'), true);
    return false;
  }
  const v = parseFloat(m[2].replace(',', '.'));
  if (m[1].toLowerCase() === 'p') setGoalPoints(v); else setMatchMinutes(v);
  return true;
}
function setGoalPoints(v) {
  GOAL_GIFTS = Math.max(1, Math.min(1000, Math.round(v)));
  adminToast('⚙ META: ' + GOAL_GIFTS + ' PUNTOS');
  ['lamine', 'mbappe'].forEach(p => { state[p] = Math.min(state[p], GOAL_GIFTS); renderPlayer(p); });
  Sound.setTension();
  if (!state.winner) ['lamine', 'mbappe'].forEach(p => { if (!state.winner && state[p] >= GOAL_GIFTS) triggerGoal(p); });   // si ya llevaba más de la nueva meta, es gol
}
function setMatchMinutes(v) {
  MATCH_SECONDS = Math.round(Math.max(0.1, Math.min(240, v)) * 60);
  adminToast('⚙ PARTIDO: ' + (Math.round(MATCH_SECONDS / 6) / 10) + ' MIN');
  if (state.winner !== 'final') { state.endAt = Date.now() + MATCH_SECONDS * 1000; state.pendingEnd = false; }
  tickClock();
}

function handleEvent(msg){
  const type=(msg.event||msg.type||'').toLowerCase();
  const data=msg.data||msg;
  const sender=data.senderDisplayName||data.displayName||data.nickname||data.uniqueId||'Alguien';
  const isChat = type === 'chat' || type.includes('comment');
  if(isChat && adminCommand(data)) return;   // los comandos funcionan siempre, incluso durante un gol
  if(state.winner) return;
  if(isChat) { handleChat(data, sender); return; }
  if(type === 'like') { handleTap(data, sender); return; }
  if(type === 'follow' || type === 'share') { handleSocial(type, sender); return; }
  if(!type.includes('gift')) return;

  // Ignorar combos en progreso; solo procesar cuando termina (repeatEnd) o no es combo
  const isComboInProgress = data.repeatEnd === false || data.giftType === 2;
  if(isComboInProgress) return;

  const reps=data.repeatCount||data.repeat_count||1;
  const g = matchGift(data.giftName||data.gift_name||'');
  if(!g) return;
  // las barridas son más lentas y no tiene sentido hacer más de las que bajan el marcador a 0
  const n   = g.type==='foul' ? Math.min(reps, Math.ceil(GOAL_GIFTS/g.points)) : g.big ? Math.min(reps, 3) : reps;
  const gap = g.type==='foul' ? 1000 : 200;
  for(let r=0;r<n;r++) setTimeout(()=>runGift(g,sender), r*gap);
}
const normName = (s) => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
function matchGift(name){
  const n = normName(name);
  return GIFTS.find(g => g.match.some(a =>
    new RegExp('(^|[^a-z0-9])' + normName(a).replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '([^a-z0-9]|$)').test(n)));
}
// ── REGALOS GRANDES: escenas en cola (penalti, gol directo, congelar), corona, hinchada x3 y hielo ──
const PENALTY_POINTS = 50;    // lo que da un penalti (la mitad del gol)
const CROWD_SECONDS  = 30;    // duración del modo hinchada tras un penalti
const CROWD_MULT     = 3;     // los comentarios de ese equipo valen x3 durante la hinchada
const FREEZE_SECONDS = 15;    // tiempo que queda congelado el jugador
const sceneQ = []; let sceneBusy = false;

const crowdMult = (p) => state.crowd[p] > Date.now() ? CROWD_MULT : 1;
const isFrozen  = (p) => state.frozen[p] > Date.now();
const rivalOf   = (p) => p === 'lamine' ? 'mbappe' : 'lamine';
const sceneEl   = () => document.getElementById('scene');

function pumpScenes() {
  if (sceneBusy) return;
  const job = sceneQ.shift();
  if (!job) return;
  if (state.winner) { sceneQ.length = 0; return; }
  sceneBusy = true;
  let ms = 2000;
  try { ms = job() || 2000; } catch (e) { console.warn('escena:', e); }
  setTimeout(() => { sceneBusy = false; pumpScenes(); }, ms);
}
function enqueueScene(job) { if (sceneQ.length < 6) sceneQ.push(job); pumpScenes(); }

function showScene(kind, icon, title, who, sub, team) {

// ⚡ PENAL = GOL: escena de penalti, el balón baja al punto de penalti, chut en cámara lenta y gol seguro
function bigDirect(g, sender) {
  const p = g.target;
  enqueueScene(() => {
    if (state.winner) return 100;
    thaw(p, true);                                   // el regalo grande rompe el hielo
    if (state.winner) return 100;
    recordDonor(p, sender, GOAL_GIFTS * pointsMult());
    setKicker(p, sender);                            // su nombre queda palpitando abajo, en el lado de su equipo
    showScene('pen', g.emoji, '⚡ PENALTI ⚡', sender, 'GOL ASEGURADO', p);
    Sound.whistle(0.7);
    const ball = document.getElementById('ball');
    setTimeout(() => {                               // el balón baja al punto de penalti
      if (state.winner) return;
      const sc = sceneEl(); sc.className = 'scene kick'; sc.innerHTML = '';
      const left = PLAYERS[p].side === 'left', px = playerX(p), bot = playerBottom(p);
      const cx = left ? px + PLAYER_W/2 : GAME_W - px - PLAYER_W/2;
      ball.style.animation = 'none';
      ball.style.transition = 'left 0.7s ease-in, top 0.7s ease-in, transform 0.7s linear';
      ball.style.left = (cx - 32 + (left ? 30 : -30)) + 'px';
      ball.style.top  = (GAME_H - bot - 90) + 'px';
      ball.style.transform = 'rotate(180deg)';
    }, 1400);
    setTimeout(() => {                               // chut en cámara lenta
      if (state.winner) return;
      boost(p);
      ball.style.transition = 'left 1.3s cubic-bezier(0.3,0.7,0.4,1), top 1.3s cubic-bezier(0.3,0.7,0.4,1), transform 1.3s linear';
      ball.style.left = '171px'; ball.style.top = (FIELD_DY - 4) + 'px';
      ball.style.transform = 'scale(0.55) rotate(540deg)';
      Sound.cheer('oh3', 1, 1);
    }, 2300);
    setTimeout(() => {                               // ¡entra! gol seguro con el nombre de quien lo pateó
      if (state.winner) return;
      hideScene(); shakeScreen();
      state[p] = GOAL_GIFTS; renderPlayer(p); boost(p);
      triggerGoal(p, sender, true);
    }, 3600);
    return 3800;
  });
}

// 🧊 CONGELAR: el jugador del panel queda sin sumar puntos 15 s (el que lo envía es hincha del rival)
function bigFreeze(g, sender) {
  const p = g.target, rival = rivalOf(p);
  enqueueScene(() => {
    if (state.winner) return 100;
    state.frozen[p] = Date.now() + FREEZE_SECONDS * 1000;

    setCrown(rival, sender);
    showScene('freeze', g.emoji, '🧊 ¡CONGELADO! 🧊', sender, PLAYERS[p].short + ' NO SUMA PUNTOS ' + FREEZE_SECONDS + 's', rival);
    Sound.foul(false);
    setTimeout(() => { if (!state.winner) hideScene(); }, 2100);
    return 2300;
  });
}

function updateTopDonor(p) {

// ── HINCHADA EN EL CAMPO: cada persona que dona o comenta aparece como un punto del color de su equipo, con su nombre y confeti ──
const MAX_FANS_PER_TEAM = 24;   // máximo de puntos por equipo (cuando se llena, se va el más antiguo)
const FAN_ZONE = {              // zona del campo donde aparecen (px del campo de 405x720)
  lamine: { x0: 42,  x1: 172, y0: 392, y1: 610 },
  mbappe: { x0: 233, x1: 363, y0: 392, y1: 610 }
};
const fans = { lamine: new Map(), mbappe: new Map() };
function fansLayer() {
  let l = document.getElementById('fans');
  if (!l) { l = document.createElement('div'); l.id = 'fans'; l.className = 'fans'; document.getElementById('game').appendChild(l); }
  return l;
}
function pickFanSpot(team) {   // elige el hueco más libre entre varios intentos al azar
  const z = FAN_ZONE[team], others = [...fans[team].values()];
  let best = null, bestD = -1;
  for (let i = 0; i < 14; i++) {
    const x = z.x0 + Math.random() * (z.x1 - z.x0), y = z.y0 + Math.random() * (z.y1 - z.y0);
    const d = others.length ? Math.min(...others.map(f => Math.hypot((f.x - x) * 0.6, f.y - y))) : 999;
    if (d > bestD) { bestD = d; best = { x: Math.round(x), y: Math.round(y) }; }
  }
  return best;
}
function fanConfetti(team, x, y, n) {
  const pal = team === 'lamine' ? ['#004d98', '#a50044', '#ffe600', '#ffffff', '#6db3ff'] : ['#ffffff', '#febe10', '#ffe27a', '#f4f4f4', '#ffd54a'];
  const side = team === 'lamine' ? -1 : 1, layer = fansLayer();
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div'); c.className = 'fan-conf';
    const w = 3 + Math.random() * 4, h = 3 + Math.random() * 5;
    c.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${pal[i % pal.length]}`;
    layer.appendChild(c);
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.2 + side * 0.25;   // hacia arriba, inclinado hacia su lado
    const r = 28 + Math.random() * 46, dx = Math.cos(a) * r, dy = Math.sin(a) * r, dur = 900 + Math.random() * 700;
    c.animate([
      { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
      { transform: `translate(${dx}px,${dy}px) rotate(${180 + Math.random() * 180}deg)`, opacity: 1, offset: 0.45 },
      { transform: `translate(${dx * 1.2}px,${dy + 60 + Math.random() * 30}px) rotate(540deg)`, opacity: 0 }
    ], { duration: dur, easing: 'ease-out' });
    setTimeout(() => c.remove(), dur + 60);
  }
}
function dropFan(team, key) {
  const f = fans[team].get(key); if (!f) return;
  fans[team].delete(key);
  const el = f.el, a = el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300 });
  a.onfinish = () => el.remove(); setTimeout(() => el.remove(), 450);
}
function clearFans() { ['lamine', 'mbappe'].forEach(t => { fans[t].forEach(f => f.el.remove()); fans[t].clear(); }); }
function addFan(team, name, big) {
  if (!FAN_ZONE[team]) return;
  userTeam.set(normName(String(name || '')), team);   // quien dona o comenta queda registrado como hincha de ese equipo (sus taps cuentan)
  const label = String(name || 'Alguien').slice(0, 18), key = normName(label), m = fans[team], now = Date.now();
  let f = m.get(key);
  if (!f) {
    if (m.size >= MAX_FANS_PER_TEAM) dropFan(team, m.keys().next().value);
    const pos = pickFanSpot(team);
    const el = document.createElement('div'); el.className = 'fan ' + (team === 'lamine' ? 'l' : 'm');
    el.style.left = pos.x + 'px'; el.style.top = pos.y + 'px';
    const dot = document.createElement('div'); dot.className = 'fan-dot'; dot.style.animationDelay = (-Math.random() * 0.9) + 's';
    const nm = document.createElement('div'); nm.className = 'fan-name'; nm.textContent = label; nm.style.animationDelay = (-Math.random() * 0.9) + 's';
    el.appendChild(dot); el.appendChild(nm);
    fansLayer().appendChild(el);
    el.animate([{ transform: 'translate(-50%,-50%) scale(0)' }, { transform: 'translate(-50%,-50%) scale(1.5)' }, { transform: 'translate(-50%,-50%) scale(1)' }], { duration: 450, easing: 'ease-out' });
    f = { el, x: pos.x, y: pos.y, last: now };
    m.set(key, f);
    fanConfetti(team, f.x, f.y, 22);
  } else if (now - f.last > 3000) {   // ya estaba: vuelve a lanzar confeti (máximo cada 3 s) y pasa a ser el más reciente
    f.last = now; m.delete(key); m.set(key, f);
    fanConfetti(team, f.x, f.y, big ? 16 : 10);
  }
}
setInterval(() => {   // confeti suave de fondo: de vez en cuando un hincha de cada equipo lanza un poco
  if (document.hidden) return;
  ['lamine', 'mbappe'].forEach(t => { const arr = [...fans[t].values()]; if (arr.length) { const f = arr[Math.floor(Math.random() * arr.length)]; fanConfetti(t, f.x, f.y, 5); } });
}, 1400);

function runGift(g, sender){

}

// ══ TAP-TAP (likes de TikTok) + IDEAS DE RETENCIÓN ══

const TAP_GOAL = 300, TAP_BONUS = 10;   // meta colectiva de taps por equipo → bonus

const TEAM_NAME = { lamine: 'BARCELONA', mbappe: 'REAL MADRID' };
const userTeam = new Map(), userTaps = new Map();
const tap = { lamine: { n: 0, acc: 0, goal: 0 }, mbappe: { n: 0, acc: 0, goal: 0 } };
let ctaHold = 0, ctaI = 0;
const G = document.getElementById('game');
['lamine', 'mbappe'].forEach(p => { const d = document.createElement('div'); d.className = 'tap ' + (p === 'lamine' ? 'l' : 'm'); d.id = 'tap-' + p; d.innerHTML = '<i></i><b>👆 0</b>'; G.appendChild(d); });
const ctaEl = document.createElement('div'); ctaEl.id = 'cta'; G.appendChild(ctaEl);
const cd10 = document.createElement('div'); cd10.id = 'cd10'; G.appendChild(cd10);

function setCTA(text, hot) { ctaEl.textContent = text; ctaEl.className = hot ? 'hot' : ''; ctaEl.style.animation = 'none'; void ctaEl.offsetWidth; ctaEl.style.animation = ''; }
function flashCTA(text, ms, hot) { ctaHold = Date.now() + ms; setCTA(text, hot); }
function nextMsg() {   // llamados rotativos al público
  if (state.golden) return ['⚡ GOL DE ORO: ¡EL PRIMERO QUE MARQUE GANA!', true];
  const top = [...userTaps.values()].sort((a, b) => b.n - a.n)[0];
  const L = ['💬 COMENTA BARCELONA O HALAMADRID PARA ELEGIR EQUIPO', '👆 TOCA LA PANTALLA: 20 TAPS = +1 PUNTO PARA TU EQUIPO', '🎁 UN REGALO VALE EL DOBLE QUE UN COMENTARIO',
             '➕ SIGUE = +' + FOLLOW_POINTS + ' PTS · ↗️ COMPARTE = +' + SHARE_POINTS + ' PTS (PARA TU EQUIPO)', '🔥 ÚLTIMO MINUTO Y GOL DE ORO: ¡PUNTOS x2!'];
  if (top) L.push('👑 TOP TAPPER: ' + top.name + ' · ' + top.n + ' TAPS');
  return [L[ctaI++ % L.length], false];
}
setInterval(() => { if (Date.now() < ctaHold || state.winner === 'final') return; const m = nextMsg(); setCTA(m[0], m[1]); }, 5000);
setCTA('💬 COMENTA BARCELONA O HALAMADRID PARA ELEGIR EQUIPO', false);

function updateTapUI(p) {
  const T = tap[p], el = document.getElementById('tap-' + p);
  el.querySelector('b').textContent = '👆 ' + (T.n >= 1000 ? (T.n / 1000).toFixed(1) + 'K' : T.n);
  el.querySelector('i').style.width = Math.min(100, T.goal / TAP_GOAL * 100) + '%';
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
}
function resetTaps() { ['lamine', 'mbappe'].forEach(p => { tap[p].n = tap[p].acc = tap[p].goal = 0; updateTapUI(p); }); userTaps.clear(); }
function handleTap(data, sender) {
  const key = normName(sender), t = userTeam.get(key);
  if (!t) { if (Date.now() > ctaHold) flashCTA('👆 ' + String(sender).slice(0, 14) + ': COMENTA BARCELONA O HALAMADRID Y TUS TAPS CUENTAN', 3500); return; }
  const n = Math.min(30, Math.max(1, +data.likeCount || 1)), T = tap[t];
  T.n += n; T.acc += n; T.goal += n;
  const u = userTaps.get(key) || { name: String(sender).slice(0, 14), n: 0 }; u.n += n; userTaps.set(key, u);
  const f = fans[t].get(normName(String(sender).slice(0, 18)));   // su punto en el campo salta con cada tap
  if (f) f.el.animate([{ transform: 'translate(-50%,-50%) scale(1)' }, { transform: 'translate(-50%,-110%) scale(1.7)' }, { transform: 'translate(-50%,-50%) scale(1)' }], { duration: 300 });
  const pts = Math.floor(T.acc / TAPS_PER_POINT);
  if (pts) { T.acc -= pts * TAPS_PER_POINT; advance(t, sender, pts, '👆'); }
  if (T.goal >= TAP_GOAL) { T.goal -= TAP_GOAL; flashCTA('👆 ¡META DE TAPS! ' + TEAM_NAME[t] + ' +' + TAP_BONUS, 3500, true); fanConfetti(t, t === 'lamine' ? 60 : 345, 690, 34); advance(t, '👆 TAPS', TAP_BONUS, '🎉'); }
  updateTapUI(t);
}
function handleSocial(type, sender) {   // seguir / compartir = puntos para el equipo del hincha
  const t = userTeam.get(normName(sender)), ico = type === 'follow' ? '➕' : '↗️';
  if (!t) { flashCTA(ico + ' ¡GRACIAS ' + String(sender).slice(0, 14) + '! COMENTA TU EQUIPO PARA SUMAR PUNTOS', 3500); return; }
  advance(t, sender, type === 'follow' ? FOLLOW_POINTS : SHARE_POINTS, ico); addFan(t, sender, true);
}
function startGolden() {   // empate al final: gol de oro de 60 s (con puntos x2), el primero que marque gana
  state.golden = true; state.pendingEnd = false;
  state.endAt = Date.now() + GOLDEN_SECONDS * 1000;
  resetGame(); Sound.whistle(0.9); shakeScreen();
  flashCTA('⚡ ¡GOL DE ORO! EL PRIMERO QUE MARQUE GANA EL PARTIDO', 6000, true);
  tickClock();
}
const alerted = { lamine: false, mbappe: false };
setInterval(() => {   // cuenta atrás gigante (últimos 10 s) y alerta de "a punto de gol"
  const left = Math.ceil((state.endAt - Date.now()) / 1000), on = !state.winner && left > 0 && left <= 10;
  cd10.classList.toggle('show', on);
  if (on && cd10.textContent !== String(left)) { cd10.textContent = left; cd10.style.animation = 'none'; void cd10.offsetWidth; cd10.style.animation = ''; }
  ['lamine', 'mbappe'].forEach(p => {
    const r = state[p] / GOAL_GIFTS;
    if (r >= 0.85 && !alerted[p] && !state.winner) { alerted[p] = true; flashCTA('🔥 ¡' + TEAM_NAME[p] + ' A PUNTO DE GOL! ¡REGALA YA!', 3500, true); }
    if (r < 0.5) alerted[p] = false;
  });
}, 250);
['lamine', 'mbappe'].forEach(renderPlayer);   // muestra 0 / meta desde el principio
['lamine', 'mbappe'].forEach(p => { const im = document.getElementById('wins-crest-' + p); if (im) im.src = PLAYERS[p].crest; });
updateWins();
setInterval(tickClock, 250);
tickClock();
</script>
</body>
</html>
